################################################################################
#
# StatAnalysis_T2_CNT_aggregate_v2.conf
#
# METplus wrapper configuration for aggregating PointStat .stat files.
#
# This version adds the time-loop controls required by the METplus
# StatAnalysis wrapper:
#   LOOP_BY
#   INIT_BEG
#   INIT_END
#   INIT_INCREMENT
#
################################################################################

[config]

PROCESS_LIST = StatAnalysis

# StatAnalysis wrapper still requires a time loop definition, even though
# stat_analysis itself only reads existing .stat files through -lookin.
# We run it once, anchored at the first initialization time.
LOOP_BY = INIT
INIT_TIME_FMT = %Y-%m-%d %H:%M:%S
INIT_BEG = 2025-09-10 06:00:00
INIT_END = 2025-09-10 06:00:00
INIT_INCREMENT = 24H

# Wrapped MET config.
STAT_ANALYSIS_CONFIG_FILE = /metplus/METplus/build/lib/metplus/parm/met_config/STATAnalysisConfig_wrapped

# Avoid MODEL_LIST warning and make model explicit.
MODEL_LIST = WRF
MODEL1 = WRF

# Job 1:
# Error statistics as a function of lead time, using both initializations.
STAT_ANALYSIS_JOB1 = -job aggregate_stat -line_type SL1L2 -out_line_type CNT -by FCST_LEAD -out_stat /work/output/point_stat/t2_cnt_aggr_by_lead_20250910_20250911.stat

# Job 2:
# Error statistics by station, using both initializations.
STAT_ANALYSIS_JOB2 = -job aggregate_stat -line_type MPR -out_line_type CNT -by OBS_SID -out_stat /work/output/point_stat/t2_cnt_aggr_by_station_20250910_20250911.stat

# Job 3:
# One global aggregate for the first initialization only.
STAT_ANALYSIS_JOB3 = -job aggregate_stat -line_type SL1L2 -out_line_type CNT -fcst_init_beg 20250910_060000 -fcst_init_end 20250911_060000 -by FCST_INIT_BEG -out_stat /work/output/point_stat/t2_cnt_aggr_by_init_20250910_20250911.stat

# Job 4:
# Error statistics as a function of valid time for the first initialization only.
STAT_ANALYSIS_JOB4 = -job aggregate_stat -line_type SL1L2 -out_line_type CNT -fcst_init_beg 20250910_060000 -fcst_init_end 20250911_060000 -by FCST_INIT_BEG,FCST_VALID_BEG -out_stat /work/output/point_stat/t2_cnt_aggr_by_init_valid_20250910_20250911.stat
# Logging.
LOG_MET_OUTPUT_TO_METPLUS = yes
LOG_LEVEL = INFO
LOG_LEVEL_TERMINAL = INFO
LOG_MET_VERBOSITY = 3

[dir]

# Input PointStat .stat directories.
# These directories are passed to stat_analysis as -lookin arguments.
MODEL1_STAT_ANALYSIS_LOOKIN_DIR = /work/output/point_stat/tmp_eval/2025-09-10_06, /work/output/point_stat/tmp_eval/2025-09-11_06

STAT_ANALYSIS_OUTPUT_DIR = /work/output/point_stat
OUTPUT_BASE = /work/output/final_conf
LOG_DIR = /work/logs
TMP_DIR = /work/tmp

################################################################################
