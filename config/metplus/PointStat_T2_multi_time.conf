################################################################################
#
# PointStat_TMP_test_v2.conf
#
# METplus wrapper configuration for the first WRF file:
#   wrfout from 2025-09-10_06:00 to 2025-09-11_06:00 UTC
#
# This run uses lead 0..23 only:
#   2025-09-10_06:00 through 2025-09-11_05:00 UTC
#
# The 2025-09-11_06:00 boundary time should be handled by the next WRF file.
#
################################################################################

[config]

PROCESS_LIST = PointStat
LOOP_BY = INIT

INIT_TIME_FMT = %Y-%m-%d %H:%M:%S
INIT_BEG = 2025-09-10 06:00:00
INIT_END = 2025-09-10 06:00:00
INIT_INCREMENT = 24H

LEAD_SEQ = begin_end_incr(0, 23, 1)

POINT_STAT_CONFIG_FILE = /work/config/met/PointStatConfig_T2_loop_friendly

# Required by the METplus PointStat wrapper to build the field list.
# The real WRF time index used by MET is controlled in PointStat_TMP.conf
# through WRF_TIME_INDEX. These entries are primarily for the wrapper.
FCST_VAR1_NAME = T2
FCST_VAR1_LEVELS = "(*,*)"

OBS_VAR1_NAME = TMP
OBS_VAR1_LEVELS = Z2

MODEL = WRF
OBTYPE = IMGW_ASCII2NC
DESC = WRF_T2_vs_IMGW_TMP

LOG_MET_OUTPUT_TO_METPLUS = yes
LOG_LEVEL = INFO
LOG_LEVEL_TERMINAL = INFO
LOG_MET_VERBOSITY = 2

[dir]

FCST_POINT_STAT_INPUT_DIR = /work/input/wrf
OBS_POINT_STAT_INPUT_DIR = /work/input/obs_nc
POINT_STAT_OUTPUT_DIR = /work/output/point_stat/tmp_eval/2025-09-10_06

OUTPUT_BASE = /work/output
LOG_DIR = /work/logs
TMP_DIR = /work/tmp

[filename_templates]

FCST_POINT_STAT_INPUT_TEMPLATE = wrfout_d01_2025-09-10.nc
OBS_POINT_STAT_INPUT_TEMPLATE = imgw_t2_2025_09.nc

[user_env_vars]

# This feeds the MET config line:
#   level = [ "(${WRF_TIME_INDEX},*,*)" ];
#
# If your MET build rejects leading-zero indices such as 06, replace this
# full-range config with generated per-lead configs or test first with
# PointStat_TMP_single_hour_test_v2.conf.
WRF_TIME_INDEX = {lead?fmt=%H}

################################################################################
