################################################################################
#
# METplotpy_T2_CNT_by_valid.conf
#
# Official-style METplus workflow:
#   UserScript(reformat_CNT)
#   UserScript(plot_CNT)
#
# Purpose:
#   Plot MAE, ME, RMSE for WRF T2 as a function of valid time.
#
# Input expected in:
#   /work/output/metplotpy/input_cnt_by_valid/
#
# Put there, for example:
#   /work/output/point_stat/t2_cnt_aggr_by_valid_20250910.stat
#
# Output:
#   /work/output/metplotpy/reformatted/t2_cnt_by_valid.data
#   /work/output/metplotpy/plots_valid/
#
################################################################################

[config]

PROCESS_LIST = UserScript(reformat_CNT), UserScript(plot_CNT)

LOOP_BY = INIT
INIT_TIME_FMT = %Y-%m-%d %H:%M:%S
INIT_BEG = 2025-09-10 06:00:00
INIT_END = 2025-09-10 06:00:00
INIT_INCREMENT = 24H

LOG_LEVEL = INFO
LOG_LEVEL_TERMINAL = INFO

[dir]

OUTPUT_BASE = /work/output
LOG_DIR = /work/logs
TMP_DIR = /work/tmp

[reformat_CNT]

USER_SCRIPT_RUNTIME_FREQ = RUN_ONCE
USER_SCRIPT_COMMAND = python3 /metplus/METplus/parm/use_cases/model_applications/medium_range/PointStat_fcstCREDIT_GFS_obsGDAS_6hrRealtime/reformat_linetype.py /work/config/metplotpy/t2_valid/reformat_CNT.yaml

[plot_CNT]

USER_SCRIPT_RUNTIME_FREQ = RUN_ONCE
USER_SCRIPT_COMMAND = python3 /metplus/METplus/parm/use_cases/model_applications/medium_range/PointStat_fcstCREDIT_GFS_obsGDAS_6hrRealtime/plot_line_stats.py

[user_env_vars]

METDATAIO_BASE = /usr/local/lib/python3.14/site-packages
METCALCPY_BASE = /usr/local/lib/python3.14/site-packages
METPLOTPY_BASE = /usr/local/lib/python3.14/site-packages
PYTHONPATH = /usr/local/lib/python3.14/site-packages

REFORMAT_CNT_INPUT_DIR = /work/output/metplotpy/input_cnt_by_valid
REFORMAT_CNT_OUTPUT_DIR = /work/output/metplotpy/reformatted
REFORMAT_CNT_OUTPUT_FILENAME = t2_cnt_by_valid.data
REFORMAT_CNT_LINETYPE = CNT

PLOTTING_CNT_YAML_CONFIG_DIR = /work/config/metplotpy/t2_valid
PLOTTING_CNT_YAML_CONFIG_FILE_LIST = custom_line_valid_time_t2.yaml

PLOTTING_CNT_FCST_STAT_LIST = MAE, ME, RMSE

PLOTTING_CNT_FCST_VAR_LIST = T2
PLOTTING_CNT_FCST_VAR_NAME_LIST = 2m Temperature
PLOTTING_CNT_FCST_VAR_UNITS_LIST = K

PLOTTING_CNT_VX_MASK_LIST = FULL

PLOTTING_CNT_STAT_INPUT = /work/output/metplotpy/reformatted/t2_cnt_by_valid.data
PLOTTING_CNT_OUTPUT_DIR = /work/output/metplotpy/plots_valid
PLOTTING_CNT_OUTPUT_FILENAME = t2_cnt_by_valid
PLOTTING_CNT_LOG_FILENAME = /work/logs/plotting_cnt_t2_by_valid.log

################################################################################
